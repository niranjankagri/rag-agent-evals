# CI: lint, tests and the eval gate on every push. Everything runs offline: no model, no API key
# and no secret, so a run costs nothing and gives the same result each time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, without a code change: a broken dependency shows up within a week
    - cron: '55 23 * * 5'   # Friday 23:55 UTC
  workflow_dispatch:

# Grouped per event too, so the weekly run and a push run on main never cancel each other
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests and eval gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing --junitxml=reports/junit.xml
      - name: Eval suites and quality gate
        run: python -m evals.run_evals
      - name: Results in the job summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Quality gate" >> "$GITHUB_STEP_SUMMARY"
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the reports and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 30
